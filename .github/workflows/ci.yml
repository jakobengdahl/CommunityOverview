# =============================================================================
# CI Pipeline – Test, Build, and Publish Docker Images
# =============================================================================
# This workflow:
#   1. Runs tests on every push and pull request
#   2. Builds and publishes both application images to GHCR on branch pushes
#   3. Emits artifact metadata that the infra repo consumes for deployment
#
# Responsibilities of this repo:
#   - Build and test the application
#   - Publish versioned, immutable images to GitHub Container Registry
#   - Signal the infra repo with artifact metadata after a successful build
#
# Responsibilities of the infra repo (NOT this repo):
#   - Deciding which pilots receive a deployment
#   - Configuring Cloud Run services, GCS volumes, and per-pilot secrets
#   - Orchestrating the actual rollout across environments
#
# Images produced:
#   Core app  – ghcr.io/<owner>/communityoverview
#   Gateway   – ghcr.io/<owner>/communityoverview-gateway
#
# Tags applied (see "Extract metadata" steps for full logic):
#   sha-<commit>          immutable, used as the canonical artifact reference
#   dev                   floating tag, latest successful build from preview branch
#   latest                floating tag, latest successful build from prod branch
#   v<semver>             applied only when a version tag is pushed
#
# Cost control (see detect-changes + the *-tests gate jobs below):
#   - The heavy test jobs run only when service code actually changed and the
#     PR is ready for review, so docs-only and draft PRs do not pay for the
#     full suite.
#   - The always-running gate jobs keep the branch-protection required-check
#     names reporting on every PR, so a skipped heavy job never blocks merge.
# =============================================================================

name: CI

on:
  push:
    # main = integration (features land here via PR); preview and prod are the
    # deploy branches (preview → preview instances, prod → production). main runs
    # the tests only — build/publish and the app-release dispatch fire on preview
    # and prod (and version tags); see the build job's `if`.
    branches: [main, preview, prod]
    tags: ['v*']
    # A push whose entire diff is documentation never needs CI: main runs tests
    # only (no deploy), and a docs-only push to a deploy branch produces no
    # meaningful image change. A push event has no merge gate, so skipping the
    # whole workflow here is safe and saves runner minutes. Pull requests
    # deliberately do NOT use paths-ignore (see the note under `pull_request`).
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    # No paths-ignore here on purpose. A required status check that never runs
    # (because the workflow was path-skipped) stays permanently "expected" and
    # blocks the merge forever. Instead the workflow always runs on PRs; the
    # `detect-changes` job gates the heavy jobs, and the always-running `*-tests`
    # gate jobs keep the required-check names reporting on every PR. The
    # `ready_for_review` type is required so a draft→ready transition re-runs CI.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, preview, prod]

# Cancel superseded runs: a force-push or rapid re-push to the same ref cancels
# the older in-flight run instead of paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal default token scope for every job. The build job widens this to
# `packages: write` for image publication; everything else only reads the repo.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  CORE_IMAGE: ${{ github.repository }}
  GATEWAY_IMAGE: ${{ github.repository }}-gateway

jobs:
  # ---------------------------------------------------------------------------
  # detect-changes — classifies the diff so the heavy test jobs only run when
  # service code actually changed. A change that touches ONLY docs/ or *.md
  # (a pure documentation slice) yields service_code=false, which skips the
  # backend/frontend/gateway test suites. Anything else — backend/, frontend/,
  # packages/, services/, config/, workflow files — yields service_code=true and
  # runs the full suite as before.
  #
  # Fail-safe: if the diff cannot be resolved (new branch, schedule/dispatch,
  # empty diff) the job defaults to service_code=true so tests are never skipped
  # by accident.
  # ---------------------------------------------------------------------------
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      service_code: ${{ steps.classify.outputs.service_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          changed=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --quiet origin "$PR_BASE_SHA" 2>/dev/null || true
            # `|| true`: if the diff errors (unresolvable sha), fall through to
            # the empty-diff fail-safe below (service_code=true) instead of
            # aborting the job under `set -e`.
            changed="$(git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA" || true)"
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ -n "${PUSH_BEFORE:-}" ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
              changed="$(git diff --name-only "$PUSH_BEFORE" "$GITHUB_SHA" || true)"
            else
              changed="$(git diff --name-only "${GITHUB_SHA}~1" "$GITHUB_SHA" 2>/dev/null || true)"
            fi
          fi

          echo "Event: $EVENT_NAME"
          echo "Changed files:"
          printf '%s\n' "$changed"

          # Fail-safe: could not resolve a diff (schedule/dispatch/new branch) ->
          # run the heavy jobs.
          if [ -z "$changed" ]; then
            echo "No diff resolved — defaulting service_code=true (fail-safe)."
            echo "service_code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          service_code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/*|*.md) ;;        # documentation only
              *) service_code=true ;; # real service/app/config/workflow code
            esac
          done <<< "$changed"

          echo "service_code=$service_code" >> "$GITHUB_OUTPUT"
          echo "Resolved: service_code=$service_code"

  # ---------------------------------------------------------------------------
  # Backend tests – full pytest suite. Runs only when service code changed and
  # the PR is ready for review (draft PRs skip it). Installs only the base
  # (ML-free) requirements: semantic search and the chat paths fall back to
  # their mock/no-embedding implementations, so the suite runs without any
  # network model download.
  #
  # This is the WORKER job. Branch protection requires the "Backend tests" gate
  # job below (not this one), so a skip here never blocks merge.
  # ---------------------------------------------------------------------------
  backend-tests-run:
    name: Backend tests (run)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.service_code == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run backend test suite
        run: pytest backend/ -q
        env:
          PYTHONPATH: ${{ github.workspace }}

  # Gate: always runs and carries the branch-protection required-check name
  # "Backend tests". Passes when the worker succeeded or was skipped (docs-only
  # or draft PR); fails only when the worker actually failed or was cancelled.
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: [detect-changes, backend-tests-run]
    if: always()
    steps:
      - name: Verify backend tests succeeded or were skipped
        env:
          DETECT: ${{ needs.detect-changes.result }}
          RESULT: ${{ needs.backend-tests-run.result }}
        run: |
          echo "detect-changes result: $DETECT | Backend tests (run) result: $RESULT"
          if [ "$DETECT" != "success" ]; then
            echo "::error::detect-changes did not succeed ($DETECT); refusing to pass the gate"
            exit 1
          fi
          case "$RESULT" in
            success|skipped) echo "Gate passed."; exit 0 ;;
            *) echo "::error::Backend tests result '$RESULT' is not acceptable"; exit 1 ;;
          esac

  # ---------------------------------------------------------------------------
  # Frontend tests – vitest across all npm workspaces (web, widget, canvas, xr).
  # GitHub Actions sets CI=true, so vitest runs once instead of watch mode.
  # Playwright e2e stays out of this required path (see DEVELOPMENT.md).
  #
  # WORKER job; the "Frontend tests" gate below carries the required-check name.
  # ---------------------------------------------------------------------------
  frontend-tests-run:
    name: Frontend tests (run)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.service_code == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run workspace unit tests
        run: npm run test:unit

  # Gate carrying the required-check name "Frontend tests".
  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    needs: [detect-changes, frontend-tests-run]
    if: always()
    steps:
      - name: Verify frontend tests succeeded or were skipped
        env:
          DETECT: ${{ needs.detect-changes.result }}
          RESULT: ${{ needs.frontend-tests-run.result }}
        run: |
          echo "detect-changes result: $DETECT | Frontend tests (run) result: $RESULT"
          if [ "$DETECT" != "success" ]; then
            echo "::error::detect-changes did not succeed ($DETECT); refusing to pass the gate"
            exit 1
          fi
          case "$RESULT" in
            success|skipped) echo "Gate passed."; exit 0 ;;
            *) echo "::error::Frontend tests result '$RESULT' is not acceptable"; exit 1 ;;
          esac

  # ---------------------------------------------------------------------------
  # Gateway tests – the MCP OAuth gateway ships its own pinned dependency set,
  # so it is tested in an isolated job to keep its versions off the backend.
  #
  # WORKER job; the "Gateway tests" gate below carries the required-check name.
  # ---------------------------------------------------------------------------
  gateway-tests-run:
    name: Gateway tests (run)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.service_code == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r services/mcp_oauth_gateway/requirements-dev.txt

      - name: Run gateway tests
        run: pytest test_oauth_flow.py -q
        working-directory: services/mcp_oauth_gateway

  # Gate carrying the required-check name "Gateway tests".
  gateway-tests:
    name: Gateway tests
    runs-on: ubuntu-latest
    needs: [detect-changes, gateway-tests-run]
    if: always()
    steps:
      - name: Verify gateway tests succeeded or were skipped
        env:
          DETECT: ${{ needs.detect-changes.result }}
          RESULT: ${{ needs.gateway-tests-run.result }}
        run: |
          echo "detect-changes result: $DETECT | Gateway tests (run) result: $RESULT"
          if [ "$DETECT" != "success" ]; then
            echo "::error::detect-changes did not succeed ($DETECT); refusing to pass the gate"
            exit 1
          fi
          case "$RESULT" in
            success|skipped) echo "Gate passed."; exit 0 ;;
            *) echo "::error::Gateway tests result '$RESULT' is not acceptable"; exit 1 ;;
          esac

  # ---------------------------------------------------------------------------
  # Mobile e2e – Playwright smoke on emulated phone viewports (iPhone 13 and
  # Pixel 7, both on Chromium). Covers what unit tests cannot: that the app
  # still lays out inside a phone viewport and that its touch interactions —
  # long-press context menu, toolbox node creation, the chat composer — survive.
  #
  # NON-REQUIRED by design: this job carries no gate, is absent from branch
  # protection, and is absent from the build job's `needs`, so a red run reports
  # a mobile regression without blocking a merge or a release. It runs on the
  # workflow's existing push/pull_request triggers and adds no build or publish
  # path of its own.
  #
  # Playwright starts the backend and the vite dev server itself; see the
  # webServer block in frontend/web/playwright.config.js.
  # ---------------------------------------------------------------------------
  mobile-e2e:
    name: Mobile e2e (non-required)
    runs-on: ubuntu-latest
    needs: detect-changes
    # A browser job has more ways to wedge than a unit-test job. Bounded so a
    # hung step fails in minutes instead of holding a runner for the default six
    # hours — this job is non-required, so a timeout costs nothing but a red
    # square, while a hang costs runner minutes for everyone.
    timeout-minutes: 20
    if: >-
      needs.detect-changes.outputs.service_code == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Base requirements only, like the backend job: the specs never reach a
      # model, so the ML stack is dead weight here.
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Browser download only, no `--with-deps`: the runner image already ships
      # the shared libraries Chromium needs, and the apt-get half of
      # `--with-deps` is the one step here that can block on a package lock —
      # observed hanging for 20+ minutes after completing in 21s on an earlier
      # run of this same job.
      - name: Install Playwright browser
        run: npx playwright install chromium
        working-directory: frontend/web

      - name: Run mobile smoke tests
        run: npx playwright test tests/e2e/mobile-smoke.spec.js --project=mobile-iphone --project=mobile-pixel
        working-directory: frontend/web

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-report
          path: frontend/web/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Lint gates – mechanical correctness checks (unused imports, undefined
  # names, React rules-of-hooks). These jobs are intentionally NOT listed in
  # the build job's `needs`, so a lint failure never blocks image publication.
  # On `main` PRs they are still merge-blocking because branch protection marks
  # them required (STRUCTURE_REVIEW item A4). Config: root pyproject.toml
  # (ruff), eslint.config.mjs + .prettierrc.json (JS workspaces).
  #
  # Lint runs on every PR (including docs-only PRs): it is cheap, and keeping it
  # unconditional means the "Python lint (ruff)" and "Frontend lint" required
  # checks always report without needing a gate job.
  # ---------------------------------------------------------------------------
  python-lint:
    name: Python lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Pinned so the formatter's output is deterministic in CI. Bump in step
      # with the version developers run locally (see backend/requirements-dev.txt).
      - name: Install ruff
        run: pip install ruff==0.15.8

      - name: Ruff lint check
        run: ruff check backend scripts

      - name: Ruff format check
        run: ruff format --check backend scripts

  frontend-lint:
    name: Frontend lint (eslint + prettier)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ESLint and Prettier still walk every frontend/** file on disk,
      # frontend/xr included — this only skips installing that workspace's
      # own ~120 MB of runtime deps (three, @react-three/*, @iwer/*), which
      # neither tool resolves or needs to lint/format its source.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --workspace @community-graph/web --workspace @community-graph/widget --include-workspace-root

      - name: ESLint
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

  # ---------------------------------------------------------------------------
  # Build & Publish – only on branch/tag pushes, not pull requests. Depends on
  # the test WORKER jobs (not the gates): the image is published only when the
  # suites actually ran and passed. A docs-only push resolves service_code=false,
  # skips the workers, and therefore skips the build too (no code changed).
  # ---------------------------------------------------------------------------
  build:
    name: Build & Publish Images
    runs-on: ubuntu-latest
    needs: [backend-tests-run, frontend-tests-run, gateway-tests-run]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/preview' || github.ref == 'refs/heads/prod' || startsWith(github.ref, 'refs/tags/'))

    permissions:
      contents: read
      packages: write

    outputs:
      core_image:      ${{ env.REGISTRY }}/${{ env.CORE_IMAGE }}
      core_digest:     ${{ steps.build-core.outputs.digest }}
      gateway_image:   ${{ env.REGISTRY }}/${{ env.GATEWAY_IMAGE }}
      gateway_digest:  ${{ steps.build-gateway.outputs.digest }}
      image_tag:       sha-${{ github.sha }}
      channel:         ${{ steps.channel.outputs.channel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Determine release channel from the ref that triggered this run. The
      # channel names the deployment environment, not the branch: `main` is the
      # integration branch where features land and is never a deployment target.
      # channel=preview → pushed to the preview branch     → preview instances
      # channel=prod    → pushed to the prod branch or tag  → production
      - name: Determine release channel
        id: channel
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/preview" ]]; then
            echo "channel=preview" >> "$GITHUB_OUTPUT"
          else
            echo "channel=prod" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------------------
      # Core application image (built from root Dockerfile)
      # -------------------------------------------------------------------
      - name: Extract metadata for core image
        id: meta-core
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.CORE_IMAGE }}
          tags: |
            # Immutable SHA tag – canonical artifact reference
            type=sha,prefix=sha-
            # Floating branch tag: "dev" from preview or "latest" from prod
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/preview' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/prod' }}
            # Semver tags for version releases
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push core image
        id: build-core
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta-core.outputs.tags }}
          labels: ${{ steps.meta-core.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # amd64 only: every consumer (Cloud Run, the SSP Cloud cluster) is
          # x86_64, and no arm64 image is pulled anywhere. Building linux/arm64
          # here means QEMU emulation of the ML + npm layers, which took hours
          # whenever the gha cache was cold and doubled the cache footprint.
          platforms: linux/amd64

      # -------------------------------------------------------------------
      # Gateway image (built from services/mcp_oauth_gateway/Dockerfile)
      # -------------------------------------------------------------------
      - name: Extract metadata for gateway image
        id: meta-gateway
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.GATEWAY_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/preview' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/prod' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push gateway image
        id: build-gateway
        uses: docker/build-push-action@v5
        with:
          context: services/mcp_oauth_gateway/
          push: true
          tags: ${{ steps.meta-gateway.outputs.tags }}
          labels: ${{ steps.meta-gateway.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # amd64 only — see the note on the core image build above.
          platforms: linux/amd64

      # -------------------------------------------------------------------
      # Artifact metadata – written to the workflow summary so infra
      # engineers can inspect the release at a glance.
      # The same values are forwarded to the infra repo via notify-infra.
      # -------------------------------------------------------------------
      - name: Write artifact metadata to summary
        run: |
          echo "## Release Artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **channel** | \`${{ steps.channel.outputs.channel }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **commit_sha** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **image_tag** | \`sha-${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **core_image** | \`${{ env.REGISTRY }}/${{ env.CORE_IMAGE }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **core_digest** | \`${{ steps.build-core.outputs.digest }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **gateway_image** | \`${{ env.REGISTRY }}/${{ env.GATEWAY_IMAGE }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **gateway_digest** | \`${{ steps.build-gateway.outputs.digest }}\` |" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Notify Infra – optional repository_dispatch to the infra repo
  #
  # This job fires only when INFRA_DISPATCH_TOKEN is configured as a repository
  # secret. It sends a repository_dispatch event to the infra repo so that
  # infra-controlled deployment workflows can act on the new artifact.
  #
  # To enable: add INFRA_DISPATCH_TOKEN (a PAT with repo:write on the infra
  # repo) and INFRA_REPO (e.g. "my-org/infra") to this repository's secrets.
  # ---------------------------------------------------------------------------
  notify-infra:
    name: Notify Infra Repo
    runs-on: ubuntu-latest
    needs: build
    # Only fire when the secret is configured; fail-safe if not set.
    env:
      INFRA_DISPATCH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
    if: |
      needs.build.result == 'success' &&
      (github.ref == 'refs/heads/preview' || github.ref == 'refs/heads/prod' || startsWith(github.ref, 'refs/tags/'))

    steps:
      - name: Skip if INFRA_DISPATCH_TOKEN not configured
        if: env.INFRA_DISPATCH_TOKEN == ''
        run: |
          echo "INFRA_DISPATCH_TOKEN is not set – skipping infra notification."
          echo "To enable, add INFRA_DISPATCH_TOKEN and INFRA_REPO to repository secrets."

      - name: Dispatch to infra repo
        if: env.INFRA_DISPATCH_TOKEN != ''
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          repository: ${{ secrets.INFRA_REPO }}
          event-type: app-release
          client-payload: |
            {
              "channel":        "${{ needs.build.outputs.channel }}",
              "commit_sha":     "${{ github.sha }}",
              "ref":            "${{ github.ref }}",
              "image_tag":      "${{ needs.build.outputs.image_tag }}",
              "core_image":     "${{ needs.build.outputs.core_image }}",
              "core_digest":    "${{ needs.build.outputs.core_digest }}",
              "gateway_image":  "${{ needs.build.outputs.gateway_image }}",
              "gateway_digest": "${{ needs.build.outputs.gateway_digest }}",
              "repository":     "${{ github.repository }}",
              "run_id":         "${{ github.run_id }}"
            }
