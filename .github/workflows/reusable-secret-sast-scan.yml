# =============================================================================
# Reusable blocking secret and Python SAST scans of the CALLER's checkout.
# Another repository can call this at job level (pin to a reviewed commit SHA):
#
# permissions:
#   contents: read
# jobs:
#   secret-sast:
#     uses: jakobengdahl/CommunityOverview/.github/workflows/reusable-secret-sast-scan.yml@<COMMIT_SHA>
#     with:
#       bandit-targets: 'backend services'
#       bandit-severity: medium
#       bandit-confidence: all
#       bandit-excludes: '*/tests/*,*/test_*.py'
#       gitleaks-scan-mode: event
#       # gitleaks-config: .gitleaks.toml  # relative to the caller's checkout
#     # Organization callers of gitleaks-action also pass their license:
#     # secrets:
#     #   GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
#
# event mode preserves gitleaks-action's PR-commit range on pull_request and
# full history on schedule/workflow_dispatch. full-history adds an explicit
# history scan using the binary installed by the action, including on PRs.
# There are no reporting-only scanners or skip inputs.
# Keep run steps on the default bash -e shell (no pipefail): after tee, capture
# PIPESTATUS[0], close the summary fence, then exit with the scanner's status.
# =============================================================================

name: Secret and SAST scans

on:
  workflow_call:
    inputs:
      bandit-targets:
        description: 'Space-separated paths to scan (single line; no embedded spaces)'
        required: true
        type: string
      bandit-severity:
        description: 'Minimum severity: all, low, medium, high'
        type: string
        default: medium
      bandit-confidence:
        description: 'Minimum confidence: all, low, medium, high'
        type: string
        default: all
      bandit-excludes:
        description: 'Optional comma-separated paths/globs excluded by bandit'
        type: string
        default: ''
      gitleaks-scan-mode:
        description: 'event (PR range, otherwise full history on schedule/dispatch) or full-history'
        type: string
        default: event
      gitleaks-config:
        description: 'Optional gitleaks config path in the caller checkout'
        type: string
        default: ''
    secrets:
      GITLEAKS_LICENSE:
        description: 'License for organization callers of gitleaks-action'
        required: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # bandit – Python static application security testing (SAST). Scans the
  # caller's paths for common insecure patterns. Excludes and
  # severity/confidence thresholds are supplied by the caller. A finding
  # fails the workflow as well as showing in the job summary.
  # ---------------------------------------------------------------------------
  bandit:
    name: bandit (Python SAST)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          # Callers with only Python scripts need no dependency manifest.

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit
        env:
          SCAN_TARGETS: ${{ inputs.bandit-targets }}
          SCAN_SEVERITY: ${{ inputs.bandit-severity }}
          SCAN_CONFIDENCE: ${{ inputs.bandit-confidence }}
          SCAN_EXCLUDES: ${{ inputs.bandit-excludes }}
        run: |
          read -r -a targets <<< "$SCAN_TARGETS"
          test "${#targets[@]}" -gt 0
          echo "## bandit" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          bandit -r --severity-level "$SCAN_SEVERITY" \
            --confidence-level "$SCAN_CONFIDENCE" --exclude "$SCAN_EXCLUDES" \
            -- "${targets[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status="${PIPESTATUS[0]}"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # ---------------------------------------------------------------------------
  # gitleaks – secret scanning. Complements GitHub's native secret scanning (a
  # repo setting) with a committed, self-contained check via the maintained
  # gitleaks-action (which manages the binary version). On pull_request the
  # action scans only the PR's commits; on schedule and workflow_dispatch it
  # scans the full history, so a secret already on main is caught by the weekly
  # run, not by a PR. Blocking: the history is clean, so any hit fails the
  # workflow.
  # ---------------------------------------------------------------------------
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history, so the scheduled scan can cover every commit and a PR
          # scan can resolve the PR's commit range.
          fetch-depth: 0

      - name: Validate gitleaks scan mode
        env:
          SCAN_MODE: ${{ inputs.gitleaks-scan-mode }}
        run: |
          case "$SCAN_MODE" in
            event|full-history) ;;
            *) echo "Invalid gitleaks scan mode: $SCAN_MODE" >&2; exit 1 ;;
          esac

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: ${{ inputs.gitleaks-config }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

      # The action always blocks and keeps its existing event-based range logic.
      # It installs gitleaks on PATH; this additional scan has no log range.
      # GITHUB_EVENT_NAME cannot be overridden to change the action's range.
      - name: Run gitleaks over full history
        if: ${{ inputs.gitleaks-scan-mode == 'full-history' }}
        env:
          GITLEAKS_CONFIG: ${{ inputs.gitleaks-config }}
        run: |
          echo "## gitleaks (full history)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          gitleaks detect --redact --verbose --exit-code=2 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status="${PIPESTATUS[0]}"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
