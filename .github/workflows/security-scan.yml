# =============================================================================
# Security Scan – dependency, SAST and secret scanning
# =============================================================================
# Runs pip-audit over the Python requirement files and `npm audit` over the
# JS workspaces to surface known-vulnerable dependencies (STRUCTURE_REVIEW C5),
# bandit over the Python source, and gitleaks over the commit history.
#
# Triggers:
#   - pull_request : catches vulnerable dependencies introduced by a change
#   - schedule     : catches newly-disclosed advisories against unchanged deps
#   - workflow_dispatch : on-demand manual run
#
# Every scanner is blocking: no step here carries `continue-on-error`. A secret
# in the range gitleaks scans (see the reusable workflow for that range), a
# known-vulnerable dependency, or a medium+ bandit finding fails the workflow.
# The reporting-only stage is over - a green run now means nothing was found,
# which is what makes the run's conclusion worth watching.
#
# Every scanner step that tees its report into the job summary exits with the
# SCANNER's status (`exit "${PIPESTATUS[0]}"`), not tee's. Without that the
# pipeline's status is tee's, so a finding would report a green step on its own
# account - the masking layer that sat underneath `continue-on-error`.
#
# CodeQL is intentionally NOT configured here: it is enabled via GitHub's
# repository-level default setup, not through a committed workflow.
# =============================================================================

name: Security Scan

on:
  pull_request:
    branches: [main, preview]
  schedule:
    # Weekly, Monday 06:00 UTC – re-audits unchanged deps against fresh advisories.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # pip-audit – Python dependency advisories.
  # Audits the requirement files directly (no install), so the heavy ML stack
  # is not resolved here. requirements-ml.txt is intentionally skipped: it
  # pulls torch from the pytorch extra index (see its header comment), which is
  # slow and network-fragile to resolve; the base + dev + gateway files cover
  # every dependency shipped in the default install.
  # ---------------------------------------------------------------------------
  pip-audit:
    name: pip-audit (Python deps)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit backend base requirements
        run: |
          echo "## pip-audit — backend/requirements.txt" >> "$GITHUB_STEP_SUMMARY"
          pip-audit -r backend/requirements.txt -f markdown 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

      - name: Audit backend dev requirements
        run: |
          echo "## pip-audit — backend/requirements-dev.txt" >> "$GITHUB_STEP_SUMMARY"
          pip-audit -r backend/requirements-dev.txt -f markdown 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

      - name: Audit gateway requirements
        run: |
          echo "## pip-audit — services/mcp_oauth_gateway/requirements.txt" >> "$GITHUB_STEP_SUMMARY"
          pip-audit -r services/mcp_oauth_gateway/requirements.txt -f markdown 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

  # ---------------------------------------------------------------------------
  # npm audit – JS dependency advisories. The root lockfile covers every
  # workspace, so a single root audit reports across web, widget, canvas and xr.
  # --omit=dev limits the report to dependencies that ship at runtime.
  # ---------------------------------------------------------------------------
  npm-audit:
    name: npm audit (JS deps)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Audit production dependencies
        run: |
          echo "## npm audit (--omit=dev, all workspaces)" >> "$GITHUB_STEP_SUMMARY"
          npm audit --omit=dev 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

  # Scanner check names now include this caller prefix: "Secret and SAST / ".
  # The required checks documented in CLAUDE.md belong to ci.yml and are unchanged.
  secret-sast:
    name: Secret and SAST
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/reusable-secret-sast-scan.yml
    with:
      bandit-targets: 'backend services'
      bandit-severity: medium
      bandit-confidence: all
      bandit-excludes: '*/tests/*,*/test_*.py'
      gitleaks-scan-mode: event
      gitleaks-config: ''
