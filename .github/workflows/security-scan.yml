# =============================================================================
# Security Scan – dependency vulnerability reporting
# =============================================================================
# Runs pip-audit over the Python requirement files and `npm audit` over the
# JS workspaces to surface known-vulnerable dependencies (STRUCTURE_REVIEW C5).
#
# Triggers:
#   - pull_request : catches vulnerable dependencies introduced by a change
#   - schedule     : catches newly-disclosed advisories against unchanged deps
#   - workflow_dispatch : on-demand manual run
#
# Blocking vs. reporting: gitleaks, pip-audit and npm audit are blocking - a
# secret in the range gitleaks scans (see the gitleaks job for what that range
# is) or a known-vulnerable dependency fails the workflow. bandit is still
# reporting-only (`continue-on-error`) while its last open findings on main - one
# hardcoded temp directory used in two places, pending an open change to one of
# those files - are cleared.
#
# Every scanner step that tees its report into the job summary exits with the
# SCANNER's status (`exit "${PIPESTATUS[0]}"`), not tee's. Without that the
# pipeline's status is tee's, so a finding would report a green step even
# where `continue-on-error` is absent. With `continue-on-error` present (bandit)
# a finding marks the step failed while the job still succeeds.
#
# CodeQL is intentionally NOT configured here: it is enabled via GitHub's
# repository-level default setup, not through a committed workflow.
# =============================================================================

name: Security Scan

on:
  pull_request:
    branches: [main, preview]
  schedule:
    # Weekly, Monday 06:00 UTC – re-audits unchanged deps against fresh advisories.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # pip-audit – Python dependency advisories.
  # Audits the requirement files directly (no install), so the heavy ML stack
  # is not resolved here. requirements-ml.txt is intentionally skipped: it
  # pulls torch from the pytorch extra index (see its header comment), which is
  # slow and network-fragile to resolve; the base + dev + gateway files cover
  # every dependency shipped in the default install.
  # ---------------------------------------------------------------------------
  pip-audit:
    name: pip-audit (Python deps)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit backend base requirements
        run: |
          echo "## pip-audit — backend/requirements.txt" >> "$GITHUB_STEP_SUMMARY"
          pip-audit -r backend/requirements.txt -f markdown 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

      - name: Audit backend dev requirements
        run: |
          echo "## pip-audit — backend/requirements-dev.txt" >> "$GITHUB_STEP_SUMMARY"
          pip-audit -r backend/requirements-dev.txt -f markdown 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

      - name: Audit gateway requirements
        run: |
          echo "## pip-audit — services/mcp_oauth_gateway/requirements.txt" >> "$GITHUB_STEP_SUMMARY"
          pip-audit -r services/mcp_oauth_gateway/requirements.txt -f markdown 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

  # ---------------------------------------------------------------------------
  # npm audit – JS dependency advisories. The root lockfile covers every
  # workspace, so a single root audit reports across web, widget, canvas and xr.
  # --omit=dev limits the report to dependencies that ship at runtime.
  # ---------------------------------------------------------------------------
  npm-audit:
    name: npm audit (JS deps)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Audit production dependencies
        run: |
          echo "## npm audit (--omit=dev, all workspaces)" >> "$GITHUB_STEP_SUMMARY"
          npm audit --omit=dev 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

  # ---------------------------------------------------------------------------
  # bandit – Python static application security testing (SAST). Scans the
  # backend and gateway source for common insecure patterns. Test directories
  # are excluded (asserts and fixtures produce noise). -ll limits to medium+
  # severity. Reporting-only for now, unlike the audits above: a finding marks
  # the step failed and shows in the job summary without failing the workflow.
  # ---------------------------------------------------------------------------
  bandit:
    name: bandit (Python SAST)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit (medium+ severity, non-blocking)
        # Temporary: reporting-only until the remaining B108 findings on main are cleared.
        continue-on-error: true
        run: |
          echo "## bandit (backend + services, medium+ severity)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          bandit -r backend services \
            -x '*/tests/*,*/test_*.py' \
            -ll 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status="${PIPESTATUS[0]}"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # ---------------------------------------------------------------------------
  # gitleaks – secret scanning. Complements GitHub's native secret scanning (a
  # repo setting) with a committed, self-contained check via the maintained
  # gitleaks-action (which manages the binary version). On pull_request the
  # action scans only the PR's commits; on schedule and workflow_dispatch it
  # scans the full history, so a secret already on main is caught by the weekly
  # run, not by a PR. Blocking: the history is clean, so any hit fails the
  # workflow.
  # ---------------------------------------------------------------------------
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history, so the scheduled scan can cover every commit and a PR
          # scan can resolve the PR's commit range.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
